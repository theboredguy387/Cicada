<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cicada</title>
<meta name="description" content="Seventeen years underground.">
<meta name="theme-color" content="#1a0f2e">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="desktop">
  <div class="glow" aria-hidden="true"></div>

  <main class="window" role="main">

    <div class="titlebar">
      <div class="titlebar__left">
        <span class="titlebar__dot titlebar__dot--green"></span>
        <span class="titlebar__text">Cicada</span>
      </div>
      <div class="titlebar__buttons">
        <button class="sysbtn" type="button" aria-label="Minimise"><span class="sysbtn__glyph sysbtn__glyph--min"></span></button>
        <button class="sysbtn" type="button" aria-label="Maximise"><span class="sysbtn__glyph sysbtn__glyph--max"></span></button>
        <button class="sysbtn sysbtn--danger" type="button" id="close-btn"><span class="sysbtn__glyph sysbtn__glyph--close"></span></button>
      </div>
    </div>

    <div class="window__body">

      <div class="portrait">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="wing" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#a8c880" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#3a4a2a" stop-opacity="0.15"/>
            </radialGradient>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#8fbc5a" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#8fbc5a" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
          <ellipse cx="55" cy="92" rx="50" ry="22" transform="rotate(-25 55 92)" fill="url(#wing)" stroke="#a8c880" stroke-width="0.6"/>
          <ellipse cx="145" cy="92" rx="50" ry="22" transform="rotate(25 145 92)" fill="url(#wing)" stroke="#a8c880" stroke-width="0.6"/>
          <ellipse cx="65" cy="118" rx="42" ry="15" transform="rotate(-20 65 118)" fill="url(#wing)" stroke="#a8c880" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="135" cy="118" rx="42" ry="15" transform="rotate(20 135 118)" fill="url(#wing)" stroke="#a8c880" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="100" cy="100" rx="13" ry="38" fill="#2a1f14" opacity="0.9"/>
          <ellipse cx="100" cy="72" rx="10" ry="11" fill="#1a1208"/>
          <circle cx="94" cy="68" r="3.2" fill="#e8c060"/>
          <circle cx="106" cy="68" r="3.2" fill="#e8c060"/>
          <circle cx="94" cy="68" r="1.1" fill="#0a0f0a"/>
          <circle cx="106" cy="68" r="1.1" fill="#0a0f0a"/>
          <path d="M89 90 L72 106 M89 100 L70 118 M89 110 L74 130" stroke="#2a1f14" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9"/>
          <path d="M111 90 L128 106 M111 100 L130 118 M111 110 L126 130" stroke="#2a1f14" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9"/>
          <ellipse cx="100" cy="134" rx="8" ry="17" fill="#1a1208" opacity="0.8"/>
        </svg>
      </div>

      <div class="pitch">
        <p class="pitch__eyebrow">v1</p>
        <p class="pitch__tagline">Seventeen years underground.<br>Emerges when it wants.</p>
        <p class="pitch__rotator" id="rotator">You won't hear it coming.</p>

        <div class="downloads">
          <a class="btn" href="https://cold5.gofile.io/download/web/e275181c-aaef-4b1d-979f-7cbf68de2771/cicada.exe">
            <span class="btn__label">Download for Windows</span>
            <span class="btn__meta">.exe · 85 MB</span>
          </a>
        </div>

        <p class="pitch__note" id="status">It was already here.</p>
      </div>

    </div>

    <div class="taskbar">
      <span class="taskbar__start">
        <span class="taskbar__flag" aria-hidden="true"></span>
        <span class="taskbar__word">start</span>
      </span>
      <span class="taskbar__item taskbar__item--active">cicada.exe</span>
      <span class="taskbar__spacer"></span>
      <span class="taskbar__clock" id="clock">--:--</span>
    </div>

  </main>

  <p class="colophon">no uninstaller · no terms of service · no explanation</p>
</div>

<script src="script.js"></script>
</body>
</html>
